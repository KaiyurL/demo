
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/localhost_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=demo
spring.datasource.password=123456

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# MyBatis-Plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl


logging.level.com.baomidou.mybatisplus=DEBUG
logging.level.org.mybatis=DEBUG

# JWT 配置
security.jwt.secret=demo-jwt-secret-key-for-spring-security-2026
security.jwt.expiration-millis=7200000
